# Publishes @agentgates/cli to npm from a release of this repository, with
# npm's trusted publishing (OIDC): no npm token and no two-factor prompt.
# A release tagged cli-v<version> carries the package's tarball, made by
# `npm pack` from the CLI's own repository at its version commit. This job
# checks the tarball's name and version against the tag and publishes it as
# it is. Provenance stays off: the CLI's source is not in this repository.
name: Publish @agentgates/cli

on:
  release:
    types: [published]
  # A release whose publish failed is published again by its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release to publish, like cli-v0.103.0'
        required: true

permissions:
  id-token: write # npm's trusted publishing
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'cli-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: npm 11.5.1 or later
        run: npm install -g npm@11 && npm --version

      - name: The release's tarball, checked against its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'agentgates-cli-*.tgz' --dir pkg
          test "$(ls pkg | wc -l)" -eq 1
          tar -xzf pkg/*.tgz package/package.json
          test "$(node -p "require('./package/package.json').name")" = "@agentgates/cli"
          test "cli-v$(node -p "require('./package/package.json').version")" = "$TAG"
          sha256sum pkg/*.tgz

      # ./ makes it a file: npm reads a bare a/b.tgz as a GitHub repository.
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: npm publish ./pkg/*.tgz --access public
